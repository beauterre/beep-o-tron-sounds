<script type='text/javascript'>//<![CDATA[

var controls=[];
function createRange(label,text,min,max,val,step)
{
	var div=document.createElement("div");
	div.className ="range-container";
	var lab=document.createElement("span");
	lab.innerHTML=text;
	lab.className ="range-label";
	var v=document.createElement("span");
	v.innerHTML=val;
	v.className ="range-value";
	var r = document.createElement("INPUT");
	r.className="range-input";
	
	r.setAttribute("type", "range");
	r.setAttribute("min", min);
	r.setAttribute("max", max);
	r.setAttribute("value", val);
	r.setAttribute("step", step);
	r.setAttribute("id", "range"+controls.length);
	r.setAttribute("oninput", "rangeVal(this.id,this.value)");
	r.setAttribute("onchange", "rangeVal(this.id,this.value)");
	div.appendChild(lab);
	div.appendChild(r);
	div.appendChild(v);
	div.style.top=controls.length*25+"px";
	document.getElementById("controls").appendChild(div);
	controls.push({val:val,l:label,r:r,v:v,d:div});
}
function rangeVal(id,val)
{
	var nr=parseInt(id.substr(5,100));
	changeControl(nr,val);
}
function setControl(lab,val)
{
	console.log("setControl "+lab+" to "+val);
	var i;
	for(i=0;i<controls.length;i++)
	{	
		if(controls[i].l==lab)
		{
			controls[i].v.innerHTML=val;
			controls[i].r.value=val;
		}
	}
}
function changeControl(nr,val)
{	
	controls[nr].v.innerHTML=val;
	switch(controls[nr].l)
	{
		case "length":
			changeRecipeLength(parseFloat(val));
		break;
		default:
		 console.log("don't know how to handle range: "+controls[nr].l);
	}
	controls[nr].val=val;
}
window.onload=function(){
	document.getElementById("start").addEventListener("click", pressPlay);
	document.getElementById("create").addEventListener("click", createNew);
	document.getElementById("vary").addEventListener("click", varyRecipe);
	document.getElementById("varytone").addEventListener("click", varyRecipeTone);
	document.getElementById("loop").addEventListener("click", changeLoop);
	document.getElementById("save").addEventListener("click", saveRecipe);
	// create ranges
	createRange("length","Lengte huidige geluid",0,5,recipe.l,0.1);
	createRange("complexity","Complexiteit nieuw geluid",0,7,4,1);
	createRange("harmony","Aantal tonen nieuw geluid",1,8,1,1);
	createNew(false);
	showSaved();
	setTimeout(playSound,100);
};
function basicRecipeFormatting(str)
{
	str=str.replace(":[", ":[\n");
	str=str.replace('"f":', '"f":');
	for(var i=0;i<recipe.o.length;i++)
		str=str.replace('},{"t"', '},\n{"t"');
	str=str.replace('},{"t"', '},\n{"t"');
	str=str.replace("],", "\n],\n");
	str=str.replace('"l"', '\n"l"');
	str=str.replace('"e"', '\n"e"');
	return str;
}
function addToUndoBuffer(r)
{
	if(undo[undo.length-1]!=r) // if something actually changed!
		undo.push(r);
}
function changeRecipeLength(l)
{
	addToUndoBuffer(recipe);
	recipe=JSON.parse(document.getElementById("recipe").value);
	recipe.l=l;
	recipe.e=[{t:0,v:1},{t:l,v:0}];// envelop fade
	showRecipe(JSON.stringify(recipe));
}

function varyRecipeTone()
{
	addToUndoBuffer(recipe);
	recipe=JSON.parse(document.getElementById("recipe").value);
	recipe.e=[{t:0,v:1},{t:1,v:0}];// envelop fade
	recipe.v=1;
	var i;
	for(i=0;i<recipe.o.length;i++)
	{
		var o=recipe.o[i];
		o.t=Math.floor(Math.random()*4);
	}
	showRecipe(JSON.stringify(recipe));
	var loop=document.getElementById("loop").checked;
	if(!loop)
	playSound();
}

function varyRecipe()
{
	addToUndoBuffer(recipe);
	recipe=JSON.parse(document.getElementById("recipe").value);
	recipe.l=0.1+Math.round(Math.random()*20)/10;
	recipe.e=[{t:0,v:1},{t:1,v:0}];// envelop fade
	recipe.v=1;
	var i;
	var nr_of_osc=0;
	for(i=0;i<recipe.o.length;i++)
		if(recipe.o[i].c==-1) nr_of_osc++;
	for(i=0;i<recipe.o.length;i++)
	{
		var o=recipe.o[i];
		o.f*=0.9+0.2*Math.random();
		if(o.c==-1)
		{
			o.v=(Math.random()*0.9+0.1)/nr_of_osc;
		}else
		{
			o.v*=0.9+0.2*Math.random();
		}
		o.f=Math.round(o.f*10)/10;
		o.v=Math.round(o.v*10)/10;
	}
	setControl("length",recipe.l);
	showRecipe(JSON.stringify(recipe));
	var loop=document.getElementById("loop").checked;
	if(!loop)
	playSound();
}

function loadRecipe(w,cat)
{
	var saved_array=saved.cat[cat].snds;
	var str=saved_array[w].r;
	var ta=document.getElementById("recipe");
	str=basicRecipeFormatting(str);
	ta.value = str;
	// MAAR DOE WEL EVEN DE LOOP UIT!
	document.getElementById("loop").checked=false;
	playSound();
	
	// set Details of this recipe!
	setFileDetails(w,cat);
}


function setFileDetails(nr,cat)
{
	var saved_array=saved.cat[cat].snds;
	var div=document.getElementById("details");
	var str="geluid "+(nr+1)+"/"+saved.cat[cat].snds.length+" van categorie "+saved.cat[cat].lab+", grootte "+saved_array[nr].r.length+" bytes";
	str+="<hr>Naam: <input type='text' id='renamesoundinput' value='"+saved_array[nr].name+"'></input><button onClick='javascript:renameSound("+nr+","+cat+")'>Hernoem</button>";
	div.innerHTML=str;
}

function renameSound(nr,cat)
{
	var new_name=document.getElementById("renamesoundinput").value;
	console.log("renameSound(nr,cat,"+new_name+")");
	saved.cat[cat].snds[nr].name=new_name;
	showSaved();
	setFileDetails(nr,cat);	
}
function removeRecipe(nr,cat)
{
	var saved_array=saved.cat[cat].snds;
	saved_array.splice(nr,1);
	showSaved();
}
function moveRecipe(nr,cat,d)
{
	var saved_array=saved.cat[cat].snds;
	if(nr==0 && d==1)
	{
		return;
	}
	if(nr==(saved.length-1) && d==-1)
	{
		return;
	}
	var temp=saved_array[nr];
	saved_array.splice(nr,1);
	saved_array.splice(nr-d, 0, temp); 
	showSaved();
}

function saveRecipe()
{
	var error=false;
    try{
        recipe=JSON.parse(document.getElementById("recipe").value);
    }catch(e){
		// show that it's wrong..
		error=true;
		window.prompt("Current JSON contains errors and cannot be saved.");
		return;
    }


	var saved_array=saved.cat[saved.current_cat].snds;
	var name=saved.cat[saved.current_cat].lab+" "+(saved_array.length+1);
	name=window.prompt("New sound name?",name);
	if(name!=null)
	{
		saved_array.push({name:name,r:JSON.stringify(recipe)});
		showSaved();
	}
}

function setCategory()
{
	// user changed categories.
	var x = document.getElementById("categories").value;
	saved.current_cat=parseInt(x);
	showSaved();
}
function showSaved()
{

	localStorage.setItem("beepotron", JSON.stringify(saved));

			for(j=0;j<arr.length;j++)
			{	
				var o=JSON.parse(JSON.stringify(arr[j]));
				o.cat=i;
				o.nr=j;
				o.name="["+saved.cat[i].lab.substr(0,3)+"] "+o.name;
				saved_array.push(o);
			}
		}

	}

	str+="</td></tr>";
	var cat=saved.current_cat;
	for(i=0;i<saved_array.length;i++)
	{
		var nr=i;

			nr=saved_array[i].nr;
		}

		str+="<a href='javascript:removeRecipe("+nr+","+cat+");'>X</a></td></tr>";
	}
	str+="</table>"
	document.getElementById("saved").innerHTML=str;
	
	// show categorieen.

	var str="";
		str+="<select id='categories' onChange='setCategory()'>";
	var i;
	for(i=0;i<saved.cat.length;i++)
	{
		var extra="";
		if(i==saved.current_cat)
		{
			extra="selected";
		}		
		str+="<option "+extra+" value='"+i+"'>"+saved.cat[i].lab+"</option>";
	}
	extra="";
	if(saved.current_cat==-1) extra="selected";
	str+="<option "+extra+" value='-1'>Alles</option>";
	str+="</select><button onClick='createCategory();'>+</button><button onClick='deleteCategory();'>-</button><button onClick='renameCategory();'>hernoem</button>";
	var cat_div=document.getElementById("cat-container").innerHTML=str;
}
function createCategory()
{
	var name=prompt("Geef een naam op voor de nieuwe categorie");
	if(name!=null)
	{
		var i=0;
		var bestaat_al=false;
		for(i=0;i<saved.cat.length;i++)
		{
			if(saved.cat[i].lab==name)
			{
				saved.current_cat=i;
				bestaat_al=true;
			}
		}
		if(bestaat_al==false)
		{
			saved.current_cat=saved.cat.length;
			saved.cat.push({lab:name,snds:[]});
			
		}else
		{
			window.alert("deze categorie bestaat al.");
		}
	}
	showSaved();
}
function deleteCategory()
{
	if(saved.current_cat==-1)
	{
		if(confirm("Weet je heel zeker, dat ALLE geluiden wilt verwijderen?"))
		{
			saved.cat=[];
		}
	}else{
		if(saved.cat[saved.current_cat].snds.length==0)
		{
			saved.cat.splice(saved.current_cat,1);
			saved.current_cat--;
		}
		else if(confirm("Weet je zeker, dat je alle ("+saved.cat[saved.current_cat].snds.length+") geluiden uit de categorie: '"+saved.cat[saved.current_cat].lab+"' wilt verwijderen?"))
		{
			saved.cat.splice(saved.current_cat,1);
			saved.current_cat--;
		}
	}
	showSaved();
}
function renameCategory()
{
	if(saved.current_cat==-1) return;
	var name=prompt("Geef een nieuwe naam op voor categorie: '"+saved.cat[saved.current_cat].lab+"'");
	if(name!=null)
	{
		saved.cat[saved.current_cat].lab=name;
		showSaved();
	}

}

function createNew(play)
{
	console.log("createNew "+controls[1].val+","+controls[2].val)
	var recipe=createRecipe(controls[1].val,controls[2].val);
	// set the value of length range.
	setControl("length",recipe.l);
	
	addToUndoBuffer(recipe);
	showRecipe(JSON.stringify(recipe));
	if(play)playSound();
}
function showRecipe(str)
{
	var ta=document.getElementById("recipe");
	str=basicRecipeFormatting(str);
	ta.value = str;
}
function changeLoop()
{
	var loop=document.getElementById("loop").checked;
	var play=document.getElementById("start");
	play.innerHTML="&#9658;";
}
function pressPlay()
{
	var loop=document.getElementById("loop").checked;
	var play=document.getElementById("start");
	console.log("play.innerHTML"+play.innerHTML);
	var looping=(play.innerHTML.length>1); // it's a pause thing, else it's a play thing, which is 1 character!
	if(looping)
	{
		console.log("we were looping");
		play.innerHTML="&#9658;";
		document.getElementById("loop").checked = false;
	}else
	{
		if(loop) // loop flag on, we'll be going into a loop
		{
			play.innerHTML="&#10074; &#10074;";
			// it's allready playing, guess you want to stop?
			playSound();
		}else
		{
			play.innerHTML="&#9658;";
			playSound();
		}

	}
}

function playSound()
{
	var r=recipe;
	var error=false;
    try{
        r=JSON.parse(document.getElementById("recipe").value);
    }catch(e){
		// show that it's wrong..
		error=true;
		r=undo[undo.length-1];// don't change it, until it is no longer broken.
    }
	if(error) document.getElementById("recipe").style.color="#f00";
	else document.getElementById("recipe").style.color="#000";
	playBeepoTron(r,1,0); // volume, pitch
	var loop=document.getElementById("loop").checked;
	if(loop)
	{
		setTimeout(playSound,r.l*1000+300); // it doesn't slow down is l is made longer?
	}
}
