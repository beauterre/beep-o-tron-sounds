<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
<title>Dynamic .WAV Generation in JavaScript</title>
<script type="text/javascript">
//<![CDATA[
var player; // store embed tag
var bitsPerSample = 16;
// This is where the magic happens
// only 48000 samplerate is working

function generate(f) {

    bitsPerSample=parseInt(f.bitDepth.value);
	var hear = new AudioContext();
	var context = new OfflineAudioContext(parseInt(f.channels.value), parseFloat(f.length.value) * parseInt(f.sampleRate.value), parseInt(f.sampleRate.value));
    var o=context.createOscillator();
	o.type = "sine"; // Square wave
	o.frequency.value = parseInt(f.frequency.value); // frequency in h	
	o.connect(context.destination);
    o.start(0);
    o.stop(context.currentTime + parseFloat(f.length.value));
	
    var o=hear.createOscillator();
	o.type = "sine"; // Square wave
	o.frequency.value = parseInt(f.frequency.value); // frequency in h	
	o.connect(hear.destination);
    o.start(0);
    o.stop(context.currentTime + parseFloat(f.length.value));
	
//	    var volume = parseInt(f.volume.value);

	context.oncomplete = function(e) {
	  var audioBuffer = e.renderedBuffer;
	  console.log("sampleRate :"+audioBuffer.sampleRate);
	  console.log("length :"+audioBuffer.length);
	  console.log("duration :"+audioBuffer.duration);
	  console.log("numberOfChannels :"+audioBuffer.numberOfChannels);
	  //console.log("getChannelData :"+audioBuffer.getChannelData(0));
	  saveAsWav(audioBuffer)
	};
	context.startRendering();
}
function saveAsWav(buf)
{
    var bufs=[];
	bufs[0]= buf.getChannelData(0);
	if(buf.numberOfChannels>1)
	bufs[1]= buf.getChannelData(1);
    var data = [];
    var samples = 0;
	
	    // Generate the sine waveform
    for (var i = 0; i < bufs[0].length; i++) {
        for (var c = 0; c < buf.numberOfChannels; c++) {
            data.push(pack("v", 32767*bufs[c][i]));
            samples++;
        }
	}

    data = data.join('');
    
    // Format sub-chunk
    var chunk1 = [
        "fmt ", // Sub-chunk identifier
        pack("V", 16), // Chunk length
        pack("v", 1), // Audio format (1 is linear quantization)
        pack("v", buf.numberOfChannels),
        pack("V", buf.sampleRate),
        pack("V", buf.sampleRate * buf.channels * bitsPerSample / 8), // Byte rate
        pack("v", buf.channels * bitsPerSample / 8),
        pack("v", bitsPerSample)
    ].join('');

    // Data sub-chunk (contains the sound)
    var chunk2 = [
        "data", // Sub-chunk identifier
        pack("V", samples * channels * bitsPerSample / 8), // Chunk length
        data
    ].join('');
    
    // Header
    var header = [
        "RIFF",
        pack("V", 4 + (8 + chunk1.length) + (8 + chunk2.length)), // Length
        "WAVE"
    ].join('');

    var out = [header, chunk1, chunk2].join('');
    var dataURI = "data:audio/wav;base64," + escape(btoa(out));
    
    // Append embed player
    if (player) {
        player.parentNode.removeChild(player);
    }
    player = document.createElement("embed");
    player.setAttribute("src", dataURI);
    player.setAttribute("width", 400);
    player.setAttribute("height", 100);
    player.setAttribute("autostart", true);
    document.getElementById('player-container').appendChild(player);
    
    document.getElementById('result').style.display = 'block';
    document.getElementById('wav-length').innerHTML = out.length + ' bytes';
    document.getElementById('uri-length').innerHTML = dataURI.length + ' bytes';
    
}

// Base 64 encoding function, for browsers that do not support btoa()
// by Tyler Akins (http://rumkin.com), available in the public domain
if (!window.btoa) {
    function btoa(input) {
        var keyStr = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";

        var output = "";
        var chr1, chr2, chr3;
        var enc1, enc2, enc3, enc4;
        var i = 0;

        do {
            chr1 = input.charCodeAt(i++);
            chr2 = input.charCodeAt(i++);
            chr3 = input.charCodeAt(i++);

            enc1 = chr1 >> 2;
            enc2 = ((chr1 & 3) << 4) | (chr2 >> 4);
            enc3 = ((chr2 & 15) << 2) | (chr3 >> 6);
            enc4 = chr3 & 63;

            if (isNaN(chr2)) {
                enc3 = enc4 = 64;
            } else if (isNaN(chr3)) {
                enc4 = 64;
            }

            output = output + keyStr.charAt(enc1) + keyStr.charAt(enc2) + 
                     keyStr.charAt(enc3) + keyStr.charAt(enc4);
        } while (i < input.length);

        return output;
    }
}

// pack() emulation (from the PHP version), for binary crunching
function pack(fmt) {
    var output = '';
    
    var argi = 1;
    for (var i = 0; i < fmt.length; i++) {
        var c = fmt.charAt(i);
        var arg = arguments[argi];
        argi++;
        
        switch (c) {
            case "a":
                output += arg[0] + "\0";
                break;
            case "A":
                output += arg[0] + " ";
                break;
            case "C":
            case "c":
                output += String.fromCharCode(arg);
                break;
            case "n":
                output += String.fromCharCode((arg >> 8) & 255, arg & 255);
                break;
            case "v":
                output += String.fromCharCode(arg & 255, (arg >> 8) & 255);
                break;
            case "N":
                output += String.fromCharCode((arg >> 24) & 255, (arg >> 16) & 255, (arg >> 8) & 255, arg & 255);
                break;
            case "V":
                output += String.fromCharCode(arg & 255, (arg >> 8) & 255, (arg >> 16) & 255, (arg >> 24) & 255);
                break;
            case "x":
                argi--;
                output += "\0";
                break;
            default:
                throw new Error("Unknown pack format character '"+c+"'");
        }
    }
    
    return output;
}

//]]>
</script>

<body>

<h1>Dynamic .WAV Generation in JavaScript from webAudioBuffer.</h1>

<form action="#" method="get">
<fieldset>
    <legend>Parameters</legend>
    
    <table border="0" cellspacing="0" cellpadding="0" class="form">
        <tbody><tr>
            <th><label for="channels">Channels</label></th>
            <td><input type="text" name="channels" id="channels" size="2" value="2"></td>
        </tr>
        <tr>
            <th><label for="sampleRate">Sample rate</label></th>
            <td><input type="text" name="sampleRate" id="sampleRate" size="4" value="48000"> Hz</td>
        </tr>
        <tr>
            <th><label for="bitDepth">Bit depth</label></th>
            <td><input type="text" name="bitDepth" id="bitDepth" size="2" value="16"> bits/sample</td>
        </tr>
        <tr>
            <th><label for="length">Length</label></th>
            <td><input type="text" name="length" id="length" size="2" value="2"> seconds</td>
        </tr>
        <tr>
            <th><label for="volume">"Volume"</label></th>
            <td><input type="text" name="volume" id="volume" size="6" value="32767"></td>
        </tr>
        <tr>
            <th><label for="frequency">Frequency</label></th>
            <td><input type="text" name="frequency" id="frequency" size="6" value="440"> Hz (for optimal results: frequency &#8804; sampleRate / 2)</td>
        </tr>
    </tbody></table>
    <p><input type="button" value="Generate and play" onclick="generate(this.form)"></p>
</fieldset>
</form>

<div id="result" style="display: none">
    <h2>Result</h2>
    <p><strong>Size of .wav file:</strong> <span id="wav-length"></span></p>
    <p><strong>Length of data URI:</strong> <span id="uri-length"></span></p>
    <h3>Player plugin</h3>
    <div id="player-container"></div>
</div>
